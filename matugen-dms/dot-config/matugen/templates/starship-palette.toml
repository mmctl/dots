# Matugen-generated palette
[palettes.gen]
# Neutral surfaces
bg            = '{{ colors.background.default.hex }}'
bg_alt        = '{{ colors.surface.default.hex }}'
bg_muted      = '{{ colors.surface_variant.default.hex }}'

# Foregrounds
fg            = '{{ colors.on_background.default.hex }}'
fg_surface    = '{{ colors.on_surface.default.hex }}'
fg_muted      = '{{ colors.on_surface_variant.default.hex }}'

# Accent ramp for the prompt segments
accent_strong = '{{ colors.primary.default.hex }}'
accent        = '{{ colors.secondary.default.hex }}'
info          = '{{ colors.tertiary.default.hex }}'
lang          = '{{ colors.secondary_container.default.hex }}'
status_bg     = '{{ colors.error_container.default.hex }}'

# Semantic colors
error         = '{{ colors.error.default.hex }}'
on_error      = '{{ colors.on_error.default.hex }}'
warning       = '{{ colors.tertiary.default.hex }}'
success       = '{{ colors.primary.default.hex | lighten: 8.0 }}'
readonly      = '{{ colors.tertiary.default.hex }}'
